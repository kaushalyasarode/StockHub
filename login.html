 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StockHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #171323;
            color: white;
            padding: 20px;
        }

        .login-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 38px 32px;
            background: #211b30;
            border: 1px solid #403451;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        /* Back arrow - top left */
        .top-back {
            position: absolute;
            top: 18px;
            left: 20px;
            right: auto;
            color: #c4b5fd;
            font-size: 28px;
            text-decoration: none;
            line-height: 1;
        }

        .top-back:hover {
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            color: #c4b5fd;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            color: #e5e1ed;
        }

        .input-box {
            display: flex;
            align-items: center;
            width: 100%;
            background: #171323;
            border: 1px solid #49405a;
            border-radius: 10px;
            padding: 0 13px;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: #a78bfa;
        }

        .field-icon {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: #a78bfa;
            margin-right: 10px;
        }

        .field-icon svg {
            width: 20px;
            height: 20px;
        }

        .input-box input {
            width: 100%;
            min-width: 0;
            padding: 14px 0;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
        }

        .input-box input::placeholder {
            color: #81788f;
        }

        .icon-button {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
            border: none;
            color: #a78bfa;
            cursor: pointer;
            padding: 5px;
        }

        .icon-button svg {
            width: 20px;
            height: 20px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #7c3aed;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 38px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <a href="features.html"
           class="top-back"
           aria-label="Back to features"
           title="Back">←</a>

        <div class="logo">📦</div>

        <h1>StockHub</h1>

        <p class="subtitle">Login</p>

        <form id="loginForm">

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <div class="input-box">

                    <span class="field-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <rect x="3" y="5"
                                  width="18" height="14" rx="2"></rect>
                            <path d="m3 7 9 6 9-6"></path>
                        </svg>
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-box">

                    <span class="field-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <rect x="4" y="10"
                                  width="16" height="11" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        </svg>
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <!-- Show / Hide password -->
                    <button
                        type="button"
                        class="icon-button"
                        id="togglePassword"
                        aria-label="Show password"
                        title="Show/Hide password">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                    </button>

                </div>
            </div>

            <!-- Login button -->
            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");

        // Show or hide password
        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );
            } else {
                passwordInput.type = "password";
                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }
        });

        // Navigate to the existing dashboard
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
