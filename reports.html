 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockHub - Reports</title>

<script>
(function () {
    try {
        if (localStorage.getItem("stockhubAppearance") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    } catch (error) {}
})();
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, Arial, sans-serif;
}

body {
    --page-bg: #f7f7fc;
    --text-color: #25243a;
    --card-bg: #ffffff;
    --muted-text: #77768d;
    --border-color: #eeedf5;
    --table-head: #f3f0ff;
    --input-bg: #ffffff;
    --chart-color: #8b70e8;

    background: var(--page-bg);
    color: var(--text-color);
    transition: background .25s, color .25s;
    font-size: 14px;
}

/* DARK THEME */
body.dark-mode {
    --page-bg: #0e1020;
    --text-color: #eeeeFA;
    --card-bg: #191a30;
    --muted-text: #aaa9c3;
    --border-color: #303149;
    --table-head: #22233c;
    --input-bg: #15162a;
    --chart-color: #b8a3ff;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    height: 100vh;
    background: #ffffff;
    color: #25243a;
    position: fixed;
    left: 0;
    top: 0;
    padding: 27px 15px;
    overflow-y: auto;
    z-index: 100;
    border-right: 1px solid #eeedf5;
}

.logo {
    font-size: 23px;
    font-weight: 750;
    margin-bottom: 36px;
    padding-left: 10px;
    letter-spacing: -.5px;
    color: #25243a;
}

.sidebar a {
    display: block;
    color: #66647b;
    text-decoration: none;
    padding: 13px 15px;
    margin: 5px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    transition: background .2s ease, color .2s ease;
}

.sidebar a:hover {
    background: #f3f0ff;
    color: #6048a3;
}

.sidebar a.active {
    background: #e9e2ff;
    color: #6048a3;
}

/* MAIN */
.main {
    margin-left: 240px;
    padding: 32px;
    min-height: 100vh;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 28px;
    font-weight: 750;
    letter-spacing: -.8px;
    color: #25243a;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.search {
    padding: 12px 16px;
    width: 260px;
    max-width: 100%;
    border: 1px solid var(--border-color);
    border-radius: 11px;
    background: var(--input-bg);
    color: var(--text-color);
    outline: none;
    font-size: 14px;
}

.search:focus {
    border-color: #b5a0f7;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, .13);
}

.search::placeholder {
    color: var(--muted-text);
}

/* THEME TOGGLE */
.theme-toggle {
    padding: 11px 15px;
    border: 1px solid #ded3ff;
    border-radius: 10px;
    background: #e9e2ff;
    color: #6048a3;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: .2s;
}

.theme-toggle:hover {
    background: #dcd0ff;
}

/* SUMMARY CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: var(--card-bg);
    color: var(--text-color);
    padding: 24px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px rgba(49, 36, 92, .055);
    min-width: 0;
    transition: background .25s, color .25s, transform .2s;
}

.card:hover {
    transform: translateY(-3px);
}

.card h3 {
    font-size: 13px;
    color: var(--muted-text);
    margin-bottom: 14px;
    font-weight: 600;
}

.card p {
    font-size: 28px;
    font-weight: 750;
    letter-spacing: -.5px;
    color: #6550a8;
    overflow-wrap: anywhere;
}

/* REPORT GRID */
.report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.report-box {
    background: var(--card-bg);
    color: var(--text-color);
    padding: 26px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px rgba(49, 36, 92, .055);
    min-width: 0;
    transition: background .25s, color .25s;
}

.report-box h2 {
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: 700;
}

/* CHART */
.chart {
    min-height: 280px;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 15px;
    border-bottom: 2px solid var(--border-color);
    padding: 30px 10px 35px;
    overflow-x: auto;
}

.bar-container {
    height: 215px;
    flex: 1;
    min-width: 55px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
}

.amount {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 7px;
    color: var(--text-color);
    overflow-wrap: anywhere;
    text-align: center;
}

.bar {
    width: 38px;
    max-width: 100%;
    border-radius: 7px 7px 0 0;
    transition: .3s;
    min-height: 5px;
}

.bar:hover {
    opacity: .75;
    transform: translateY(-4px);
}

.month {
    font-size: 12px;
    margin-top: 8px;
    color: var(--muted-text);
    white-space: nowrap;
}

/* STOCK LIST */
.stock-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-color);
}

.stock-item:last-child {
    border-bottom: none;
}

.stock-item > span:first-child {
    overflow-wrap: anywhere;
}

.status {
    padding: 6px 11px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

.low {
    background: #ffe7e9;
    color: #c63c4b;
}

.good {
    background: #e0f7e9;
    color: #23834c;
}

/* TABLE */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border-color);
    border-radius: 11px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    margin-top: 0;
}

th,
td {
    padding: 15px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
}

th {
    background: var(--table-head);
    color: var(--muted-text);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    white-space: nowrap;
}

td {
    color: var(--text-color);
}

tbody tr:last-child td {
    border-bottom: none;
}

tbody tr:hover {
    background: rgba(167, 139, 250, .06);
}

/* EMPTY MESSAGE */
.empty {
    text-align: center;
    color: var(--muted-text);
    padding: 25px;
}

/* DARK MODE */
html.dark-mode body {
    --page-bg: #0e1020;
    --text-color: #eeeeFA;
    --card-bg: #191a30;
    --muted-text: #aaa9c3;
    --border-color: #303149;
    --table-head: #22233c;
    --input-bg: #15162a;
    --chart-color: #b8a3ff;
}

body.dark-mode .sidebar,
html.dark-mode body .sidebar {
    background: #191a30;
    border-right-color: #303149;
}

body.dark-mode .logo,
html.dark-mode body .logo {
    color: #f3f0ff;
}

body.dark-mode .sidebar a,
html.dark-mode body .sidebar a {
    color: #c5c3d6;
}

body.dark-mode .sidebar a:hover,
html.dark-mode body .sidebar a:hover {
    background: #28243f;
    color: #ffffff;
}

body.dark-mode .sidebar a.active,
html.dark-mode body .sidebar a.active {
    background: #423365;
    color: #e0d6ff;
}

body.dark-mode .header h1 {
    color: #f3f0ff;
}

body.dark-mode .card p {
    color: #c4b5fd;
}

body.dark-mode .theme-toggle {
    background: #423365;
    color: #e0d6ff;
    border-color: #59468a;
}

body.dark-mode .theme-toggle:hover {
    background: #53417e;
}

body.dark-mode .low {
    background: #48242d;
    color: #ffadb8;
}

body.dark-mode .good {
    background: #183d2b;
    color: #8ce4ad;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
    .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .report-grid {
        grid-template-columns: 1fr;
    }

    .main {
        padding: 25px;
    }
}

@media (max-width: 700px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 18px 12px;
    }

    .logo {
        margin-bottom: 15px;
    }

    .sidebar a {
        display: inline-block;
        margin: 3px;
        padding: 10px 12px;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .header h1 {
        font-size: 25px;
    }

    .header-actions {
        width: 100%;
    }

    .search {
        width: 100%;
        min-width: 0;
    }

    .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
    }

    .report-box {
        padding: 18px;
    }

    .chart {
        gap: 8px;
        padding-left: 5px;
        padding-right: 5px;
    }
}

@media (max-width: 420px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .main {
        padding: 14px;
    }

    .report-box h2 {
        font-size: 17px;
    }

    .card {
        padding: 20px;
    }

    .card p {
        font-size: 24px;
    }

    .table-wrapper table {
        min-width: 500px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">📦 StockHub</div>

    <a href="index.html">🏠 Dashboard</a>
    <a href="inventory.html">📦 Inventory</a>
    <a href="orders.html">🛒 Orders</a>
    <a href="suppliers.html">🚚 Suppliers</a>
    <a href="customers.html">👥 Customers</a>
    <a href="reports.html" class="active">📊 Reports</a>
    <a href="notifications.html">🔔 Notifications</a>
    <a href="activity.html">📝 Activity Log</a>
    <a href="settings.html">⚙️ Settings</a>
</div>

<!-- MAIN -->
<div class="main">

    <div class="header">
        <h1>📊 Reports</h1>

        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" type="button">
                🌙 Dark Mode
            </button>

            <input
                class="search"
                id="reportSearch"
                type="search"
                placeholder="🔍 Search reports..."
                aria-label="Search reports">
        </div>
    </div>

    <!-- SUMMARY CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Total Sales</h3>
            <p id="totalSales">₹0</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p id="totalOrders">0</p>
        </div>

        <div class="card">
            <h3>Products Sold</h3>
            <p id="productsSold">0</p>
        </div>

        <div class="card">
            <h3>Low Stock Items</h3>
            <p id="lowStockItems">0</p>
        </div>

    </div>

    <!-- REPORT GRID -->
    <div class="report-grid">

        <div class="report-box">
            <h2>📈 Monthly Sales</h2>
            <div class="chart" id="salesChart"></div>
        </div>

        <div class="report-box">
            <h2>📦 Stock Status</h2>
            <div id="stockStatus"></div>
        </div>

    </div>

    <!-- TOP SELLING PRODUCTS -->
    <div class="report-box" style="margin-top:25px;">
        <h2>🏆 Top Selling Products</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Units Sold</th>
                        <th>Revenue</th>
                    </tr>
                </thead>
                <tbody id="topProducts"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
"use strict";

/* ============================
   GET DATA
============================ */

function getOrders() {
    try {
        const data = localStorage.getItem("stockhubOrders");
        if (!data) return [];

        const orders = JSON.parse(data);
        return Array.isArray(orders) ? orders : [];
    } catch (error) {
        console.error("Could not load orders.", error);
        return [];
    }
}

function getProducts() {
    try {
        const data = localStorage.getItem("stockhubProducts");
        if (!data) return [];

        const products = JSON.parse(data);
        return Array.isArray(products) ? products : [];
    } catch (error) {
        console.error("Could not load products.", error);
        return [];
    }
}

/* ============================
   MONEY FUNCTION
============================ */

function formatMoney(amount) {
    return "₹" + Number(amount || 0).toLocaleString("en-IN");
}

function getOrderAmount(order) {
    const rawAmount = order.amount ?? order.total ?? 0;

    return Number(
        String(rawAmount).replace(/[₹,\s]/g, "")
    ) || 0;
}

/* ============================
   SUMMARY CARDS
============================ */

function updateSummary() {
    const orders = getOrders();
    const products = getProducts();

    const totalSales = orders.reduce(
        (sum, order) => sum + getOrderAmount(order),
        0
    );

    document.getElementById("totalSales").textContent =
        formatMoney(totalSales);

    document.getElementById("totalOrders").textContent =
        orders.length;

    /*
      This count follows the current order structure:
      one order record is counted as one unit.
    */
    document.getElementById("productsSold").textContent =
        orders.reduce((sum, order) => {
            const quantity = Number(order.quantity);
            return sum + (
                Number.isFinite(quantity) && quantity > 0
                    ? quantity
                    : 1
            );
        }, 0);

    const lowStock = products.filter(
        product => Number(product.quantity) <= 10
    ).length;

    document.getElementById("lowStockItems").textContent =
        lowStock;
}

/* ============================
   MONTHLY SALES
============================ */

function createMonthlySales() {
    const orders = getOrders();
    const monthlySales = {};

    orders.forEach(order => {
        const rawDate = order.date || order.createdAt;
        if (!rawDate) return;

        const date = new Date(rawDate);
        if (isNaN(date.getTime())) return;

        const monthKey =
            date.getFullYear() + "-" +
            String(date.getMonth() + 1).padStart(2, "0");

        const monthLabel = date.toLocaleString("en-IN", {
            month: "short",
            year: "2-digit"
        });

        if (!monthlySales[monthKey]) {
            monthlySales[monthKey] = {
                label: monthLabel,
                amount: 0
            };
        }

        monthlySales[monthKey].amount += getOrderAmount(order);
    });

    const chart = document.getElementById("salesChart");
    chart.replaceChildren();

    const months = Object.keys(monthlySales).sort();

    if (months.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No sales data available";
        chart.appendChild(empty);
        return;
    }

    const maxValue = Math.max(
        ...months.map(key => monthlySales[key].amount),
        1
    );

    months.forEach(monthKey => {
        const monthData = monthlySales[monthKey];

        const container = document.createElement("div");
        container.className = "bar-container";

        const amountLabel = document.createElement("div");
        amountLabel.className = "amount";
        amountLabel.textContent = formatMoney(monthData.amount);

        const bar = document.createElement("div");
        bar.className = "bar";

        const height = Math.max(
            5,
            (monthData.amount / maxValue) * 90
        );

        bar.style.height = height + "%";
        bar.style.background = "var(--chart-color)";
        bar.title = monthData.label + ": " + formatMoney(monthData.amount);

        const monthLabel = document.createElement("div");
        monthLabel.className = "month";
        monthLabel.textContent = monthData.label;

        container.append(amountLabel, bar, monthLabel);
        chart.appendChild(container);
    });
}

/* ============================
   STOCK STATUS
============================ */

function createStockStatus() {
    const products = getProducts();
    const box = document.getElementById("stockStatus");

    box.replaceChildren();

    if (products.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No inventory data available";
        box.appendChild(empty);
        return;
    }

    products.forEach(product => {
        const quantity = Number(product.quantity) || 0;

        const item = document.createElement("div");
        item.className = "stock-item";

        const productLabel = document.createElement("span");
        productLabel.textContent =
            (product.name || "Unnamed Product") +
            " (" + quantity + " left)";

        const status = document.createElement("span");
        status.className = "status";

        if (quantity <= 10) {
            status.classList.add("low");
            status.textContent = "Low Stock";
        } else {
            status.classList.add("good");
            status.textContent = "In Stock";
        }

        item.append(productLabel, status);
        box.appendChild(item);
    });
}

/* ============================
   TOP SELLING PRODUCTS
============================ */

function createTopProducts() {
    const orders = getOrders();
    const products = getProducts();
    const table = document.getElementById("topProducts");

    table.replaceChildren();

    if (orders.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent = "No order data available";

        row.appendChild(cell);
        table.appendChild(row);
        return;
    }

    const productData = {};

    orders.forEach(order => {
        const name =
            order.product ||
            order.productName ||
            order.name ||
            "Unknown Product";

        const quantity = Number(order.quantity);
        const units =
            Number.isFinite(quantity) && quantity > 0 ? quantity : 1;

        const amount = getOrderAmount(order);

        if (!productData[name]) {
            productData[name] = {
                units: 0,
                revenue: 0
            };
        }

        productData[name].units += units;
        productData[name].revenue += amount;
    });

    const sortedProducts = Object.entries(productData).sort(
        (a, b) => b[1].units - a[1].units
    );

    sortedProducts.forEach(([name, data]) => {
        const product = products.find(
            item => (item.name || "").toLowerCase() === name.toLowerCase()
        );

        const category = product
            ? (product.category || "—")
            : "—";

        const row = document.createElement("tr");

        [name, category, data.units, formatMoney(data.revenue)]
            .forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = String(value);
                row.appendChild(cell);
            });

        table.appendChild(row);
    });
}

/* ============================
   SEARCH
============================ */

document.getElementById("reportSearch").addEventListener(
    "input",
    function () {
        const search = this.value.toLowerCase().trim();

        document.querySelectorAll(".report-box").forEach(section => {
            section.style.display =
                !search || section.innerText.toLowerCase().includes(search)
                    ? ""
                    : "none";
        });

        document.querySelectorAll(".card").forEach(card => {
            card.style.display =
                !search || card.innerText.toLowerCase().includes(search)
                    ? ""
                    : "none";
        });
    }
);

/* ============================
   LIGHT / DARK MODE
============================ */

function applyTheme(theme) {
    const isDark = theme === "dark";

    document.body.classList.toggle("dark-mode", isDark);
    document.documentElement.classList.toggle("dark-mode", isDark);

    const button = document.getElementById("themeToggle");

    if (button) {
        button.textContent = isDark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";
    }
}

function readSavedTheme() {
    try {
        return localStorage.getItem("stockhubAppearance") || "light";
    } catch (error) {
        return "light";
    }
}

applyTheme(readSavedTheme());

document.getElementById("themeToggle").addEventListener(
    "click",
    function () {
        const isDark = document.body.classList.contains("dark-mode");
        const newTheme = isDark ? "light" : "dark";

        try {
            localStorage.setItem("stockhubAppearance", newTheme);
        } catch (error) {
            console.error("Could not save theme setting.", error);
        }

        applyTheme(newTheme);
    }
);

/* ============================
   LOAD REPORTS
============================ */

function loadReports() {
    updateSummary();
    createMonthlySales();
    createStockStatus();
    createTopProducts();
}

loadReports();

/* ============================
   AUTO UPDATE
============================ */

window.addEventListener("storage", function (event) {
    if (
        event.key === "stockhubOrders" ||
        event.key === "stockhubProducts" ||
        event.key === null
    ) {
        loadReports();
    }

    if (event.key === "stockhubAppearance" || event.key === null) {
        applyTheme(readSavedTheme());
    }
});
</script>

</body>
</html>
